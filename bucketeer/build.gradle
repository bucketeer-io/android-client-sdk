import java.nio.file.Files
import java.nio.file.Paths

plugins {
  alias(libs.plugins.android.library)
  alias(libs.plugins.kotlin.android)
  alias(libs.plugins.ksp)
  alias(libs.plugins.publish)
  alias(libs.plugins.kotlin.dokka)
  alias(libs.plugins.kotlinter)
}

def properties = new Properties()
if (Files.exists(Paths.get("$rootProject.rootDir/local.properties"))) {
  properties.load(rootProject.file('local.properties').newDataInputStream())
}

android {
  namespace = "io.bucketeer.sdk.android"

  compileSdk project.findProperty("android.compileSdk") as int

  defaultConfig {
    minSdkVersion project.findProperty("android.minSdkVersion") as int
    targetSdkVersion project.findProperty("android.targetSdkVersion") as int

    buildConfigField("String", "SDK_VERSION", "\"${VERSION_NAME}\"")

    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    testInstrumentationRunnerArguments clearPackageData: "true"
    // E2E settings, read by the tests through E2EArguments. Passed to the test runner when the
    // tests start, not compiled into BuildConfig: CI saves compiled classes in the Gradle build
    // cache, which pull requests from forks can read.
    def e2eArguments = [
      apiKey: properties.getProperty("api_key") ?: System.getenv("API_KEY"),
      apiEndpoint: properties.getProperty("api_endpoint") ?: System.getenv("API_ENDPOINT"),
      // Key that can update flags, used only by the streaming patch tests. When unset, those
      // tests fail with a message naming it.
      publicApiKey: properties.getProperty("public_api_key") ?: System.getenv("PUBLIC_API_KEY"),
    ]
    e2eArguments.each { name, value ->
      if (value) {
        testInstrumentationRunnerArgument(name, value)
      }
    }

    testOptions {
      execution "ANDROIDX_TEST_ORCHESTRATOR"
    }
  }

  buildTypes {
    release {
      consumerProguardFiles 'proguard-rules.pro'
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  kotlinOptions {
    jvmTarget = "1.8"
  }

  lintOptions {
    disable 'InvalidPackage'
    xmlReport true
  }

  buildFeatures {
    buildConfig = true
  }

  sourceSets {
    // The proxy server the streaming E2E tests run through. Shared, so its own tests run in the
    // unit suite without a backend or keys.
    test.java.srcDirs += "src/sharedTest/kotlin"
    androidTest.java.srcDirs += "src/sharedTest/kotlin"
  }
}

androidComponents {
  onVariants(selector().all(), { variant ->
    // manually add ksp source dir
    // https://github.com/google/ksp/issues/37
    def ss = kotlin.sourceSets.findByName(variant.name)
    if (ss != null) {
      ss.kotlin.srcDirs(file("$buildDir/generated/ksp/${variant.name}/kotlin"))
    }
  })
}

configurations {
  // Reduce duplicated dependencies
  // Duplicate class com.google.common.util.concurrent.ListenableFuture
  // found in modules guava-30.1.1-android (com.google.guava:guava:30.1.1-android)
  // and listenablefuture-1.0 (com.google.guava:listenablefuture:1.0)
  all*.exclude group: 'com.google.guava', module: 'listenablefuture'
}

dependencies {
  implementation libs.androidx.sqlite

  implementation libs.okhttp.client

  implementation libs.moshi.kotlin
  implementation libs.moshi.adapters
  ksp(libs.moshi.codegen)

  implementation libs.androidx.lifecycle.process

  // Google Play Services
  compileOnly libs.googlePlayServices.basement

  testImplementation libs.okhttp.mockwebserver
  testImplementation libs.junit
  testImplementation libs.truth
  testImplementation libs.robolectric
  testImplementation libs.androidx.test.core
  testImplementation libs.testParameterInjector
  testImplementation libs.json

  androidTestImplementation libs.androidx.test.rules
  androidTestImplementation libs.androidx.test.ext
  androidTestImplementation libs.truth
  androidTestUtil libs.androidx.test.orchestrator
}

publishing {
  repositories {
    maven {
      name = "testLocal"
      url = "${rootProject.buildDir}/localMaven"
    }
  }
}

// https://github.com/Kotlin/dokka/issues/2472
afterEvaluate {
  tasks.getByName("javaDocReleaseGeneration").enabled(false)
}
