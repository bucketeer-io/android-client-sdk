import java.nio.file.Files
import java.nio.file.Paths

plugins {
  alias(libs.plugins.android.application)
  alias(libs.plugins.kotlin.android)
  alias(libs.plugins.kotlinter)
}

// Firebase is optional and only used by the FCM (real-time update) sample.
// google-services.json is developer specific and git-ignored, and the
// google-services plugin fails the build when the file is missing, so the
// plugin is applied only when a developer has dropped in their own config.
// See README "Firebase Cloud Messaging (optional)".
if (file("google-services.json").exists() || file("src/google-services.json").exists()) {
  apply plugin: libs.plugins.google.services.get().pluginId
}

def properties = new Properties()
if (Files.exists(Paths.get("$rootProject.rootDir/local.properties"))) {
  properties.load(rootProject.file('local.properties').newDataInputStream())
}

android {
  namespace = "io.bucketeer.sdk.android.sample"
  compileSdk project.findProperty("android.compileSdk") as int

  defaultConfig {
    applicationId "io.bucketeer.sample"
    minSdkVersion project.findProperty("android.minSdkVersion") as int
    targetSdkVersion project.findProperty("android.targetSdkVersion") as int
    versionCode 1
    versionName "1.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    def API_KEY = properties.getProperty("api_key") ?: System.getenv("API_KEY")
    def API_ENDPOINT = properties.getProperty("api_endpoint") ?: System.getenv("API_ENDPOINT")
    buildConfigField("String", "API_KEY", "\"${API_KEY}\"")
    buildConfigField("String", "API_ENDPOINT", "\"${API_ENDPOINT}\"")
  }
  signingConfigs {
    release {
      storeFile rootProject.file("debug.keystore")
      storePassword "android"
      keyAlias "androiddebugkey"
      keyPassword "android"
    }
  }
  buildTypes {
    debug {
      // Sign every variant with the checked-in keystore so the sample always has
      // the same SHA-1. Firebase API keys restricted to an Android app
      // (package name + SHA-1) reject builds signed with a random debug keystore.
      signingConfig signingConfigs.release
    }
    release {
      minifyEnabled true
      consumerProguardFiles 'proguard-rules.pro'
      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
      signingConfig signingConfigs.release
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  kotlinOptions {
    jvmTarget = "1.8"
  }

  buildFeatures {
    buildConfig = true
  }
}

dependencies {
  implementation projects.bucketeer

  implementation libs.stetho
  implementation libs.androidx.appcompat
  implementation libs.materialComponents
  implementation libs.androidx.lifecycle.runtime
  implementation libs.androidx.lifecycle.process

  implementation libs.kotlin.coroutines.android
  implementation(platform(libs.firebase))
  implementation libs.firebase.messaging.ktx
}
repositories {
  mavenCentral()
}
